<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#15803D">
  <title>AI 분리배출 가이드</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%2315803D'/><g transform='translate(4 4)' fill='none' stroke='white' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M7 19H4.815a1.83 1.83 0 0 1-1.57-.881 1.785 1.785 0 0 1-.004-1.784L7.196 9.5'/><path d='M11 19h8.203a1.83 1.83 0 0 0 1.556-.89 1.784 1.784 0 0 0 0-1.775l-1.226-2.12'/><path d='m14 16-3 3 3 3'/><path d='M8.293 13.596 7.196 9.5 3.1 10.598'/><path d='m9.344 5.811 1.093-1.892A1.83 1.83 0 0 1 11.985 3a1.784 1.784 0 0 1 1.546.888l3.943 6.843'/><path d='m13.378 9.633 4.096 1.098 1.097-4.096'/></g></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+KR:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <!-- Icon used by both logos (header and side panel). -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="icon-recycle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M7 19H4.815a1.83 1.83 0 0 1-1.57-.881 1.785 1.785 0 0 1-.004-1.784L7.196 9.5"/>
      <path d="M11 19h8.203a1.83 1.83 0 0 0 1.556-.89 1.784 1.784 0 0 0 0-1.775l-1.226-2.12"/>
      <path d="m14 16-3 3 3 3"/>
      <path d="M8.293 13.596 7.196 9.5 3.1 10.598"/>
      <path d="m9.344 5.811 1.093-1.892A1.83 1.83 0 0 1 11.985 3a1.784 1.784 0 0 1 1.546.888l3.943 6.843"/>
      <path d="m13.378 9.633 4.096 1.098 1.097-4.096"/>
    </symbol>
  </svg>

  <div class="layout">
    <!-- Side panel: only shown at 1100px and wider. -->
    <aside class="side">
      <div class="brand">
        <div class="logo"><svg width="26" height="26" aria-hidden="true"><use href="#icon-recycle"/></svg></div>
        <div class="title" data-i18n="title">AI 분리배출 가이드</div>
      </div>
      <h2 class="side-heading" data-i18n="howItWorks">이용 방법</h2>
      <ol class="steps">
        <li data-i18n="step1">품목을 입력하거나 눌러 보세요</li>
        <li data-i18n="step2">분리배출 방법을 확인하세요</li>
        <li data-i18n="step3">출처를 확인하세요</li>
      </ol>
      <h2 class="side-heading" data-i18n="quickQuestions">자주 묻는 품목</h2>
      <div class="chips-list" data-chips></div>
      <p class="note side-note" data-i18n="note">AI는 실수할 수 있어요. 지역별 배출 규칙을 꼭 확인하세요.</p>
    </aside>

    <main class="chat-card">
      <header class="header">
        <div class="logo"><svg width="26" height="26" aria-hidden="true"><use href="#icon-recycle"/></svg></div>
        <div class="header-text">
          <h1 class="title" data-i18n="title">AI 분리배출 가이드</h1>
          <p class="subtitle" data-i18n="subtitle">분리배출 도우미 · 환경부 공식 지침 기반</p>
        </div>
        <button class="lang-pill" id="lang" type="button" aria-label="Language: Auto">Auto</button>
      </header>

      <div class="messages" id="messages" role="log" aria-live="polite">
        <div class="today" data-i18n="today">오늘</div>
      </div>

      <div class="chips-row" data-chips></div>

      <div class="composer">
        <div class="composer-row">
          <button class="round-btn camera" id="camera" type="button" disabled title="준비 중" aria-label="카메라 (준비 중)">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>
          </button>
          <textarea id="input" rows="1" placeholder="버릴 물건을 물어보세요…" aria-label="버릴 물건을 물어보세요"></textarea>
          <button class="round-btn send" id="send" type="button" aria-label="보내기">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
          </button>
        </div>
        <p class="note" data-i18n="note">AI는 실수할 수 있어요. 지역별 배출 규칙을 꼭 확인하세요.</p>
      </div>
    </main>
  </div>

  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
